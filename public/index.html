
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090b12">
  <title>NEXUS AI</title>

  <style>
    :root {
      color-scheme: dark;
      --bg: #090b12;
      --panel: #111522;
      --panel2: #191f30;
      --border: #292f43;
      --text: #f3f5ff;
      --muted: #9ba4bb;
      --accent: #8b7cff;
      --accent2: #6554e8;
      --danger: #ff667d;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      height: 100dvh;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, sans-serif;
    }

    button, input, textarea { font: inherit; }
    button { cursor: pointer; }

    .app {
      display: grid;
      grid-template-columns: 270px minmax(0, 1fr);
      height: 100dvh;
    }

    .sidebar {
      display: flex;
      flex-direction: column;
      min-height: 0;
      padding: 20px 14px;
      background: #0d101a;
      border-right: 1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 4px 8px 22px;
    }

    .logo {
      display: grid;
      place-items: center;
      width: 40px;
      height: 40px;
      border-radius: 13px;
      background: linear-gradient(135deg, #a398ff, #6251e9);
      color: white;
      font-weight: 900;
      font-size: 20px;
      box-shadow: 0 5px 24px #7665ff30;
    }

    .brand h1 { margin: 0; font-size: 19px; letter-spacing: 1px; }
    .brand small { color: var(--muted); font-size: 11px; }

    .new-chat {
      width: 100%;
      padding: 13px;
      border: 1px solid #8879ff66;
      border-radius: 12px;
      background: #7665ff17;
      color: white;
      text-align: left;
      transition: background .2s;
    }

    .new-chat:hover { background: #7665ff30; }

    .history-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin: 25px 5px 10px;
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .small-button {
      padding: 5px 8px;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: transparent;
      color: var(--muted);
      font-size: 11px;
    }

    .small-button:hover { color: var(--danger); }

    .history {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
    }

    .history-item {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-bottom: 5px;
      padding: 4px;
      border-radius: 10px;
    }

    .history-item.active { background: var(--panel2); }

    .history-open {
      flex: 1;
      min-width: 0;
      padding: 9px 7px;
      overflow: hidden;
      border: 0;
      background: transparent;
      color: var(--text);
      text-align: left;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 13px;
    }

    .delete-chat {
      flex-shrink: 0;
      padding: 7px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: var(--muted);
    }

    .delete-chat:hover { background: #ff667d18; color: var(--danger); }

    .empty-history {
      padding: 12px 7px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .sidebar-footer {
      padding: 15px 7px 0;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 11px;
      line-height: 1.7;
    }

    .main {
      display: flex;
      flex-direction: column;
      min-width: 0;
      height: 100dvh;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 17px 24px;
      border-bottom: 1px solid var(--border);
      background: #0b0e17;
    }

    .topbar-title { font-size: 14px; font-weight: 650; }
    .status { color: #7fe0b0; font-size: 12px; }

    .menu-button {
      display: none;
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 8px 10px;
      background: var(--panel);
      color: white;
    }

    .chat {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      scroll-behavior: smooth;
    }

    .chat-inner {
      width: min(800px, 100%);
      margin: 0 auto;
      padding: 30px 24px 40px;
    }

    .welcome {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 50px 15px;
    }

    .welcome-logo {
      display: grid;
      place-items: center;
      width: 72px;
      height: 72px;
      margin-bottom: 22px;
      border: 1px solid #a398ff55;
      border-radius: 23px;
      background: linear-gradient(145deg, #9284ff30, #6554e820);
      color: #b9b0ff;
      font-size: 34px;
      font-weight: 900;
    }

    .welcome h2 { margin: 0 0 12px; font-size: clamp(25px, 4vw, 36px); }
    .welcome p { max-width: 450px; margin: 0; color: var(--muted); line-height: 1.7; }

    .suggestions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 9px;
      margin-top: 27px;
    }

    .suggestion {
      padding: 10px 13px;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: var(--panel);
      color: #dce0f3;
      font-size: 12px;
    }

    .suggestion:hover { border-color: var(--accent); }

    .message {
      display: flex;
      gap: 12px;
      margin: 0 0 25px;
      align-items: flex-start;
    }

    .avatar {
      display: grid;
      place-items: center;
      flex-shrink: 0;
      width: 34px;
      height: 34px;
      border-radius: 11px;
      background: var(--panel2);
      color: #c3baff;
      font-size: 13px;
      font-weight: 800;
    }

    .message.user .avatar {
      background: #6554e8;
      color: white;
    }

    .message-body { min-width: 0; flex: 1; padding-top: 3px; }
    .message-name { margin-bottom: 7px; font-size: 12px; font-weight: 750; }
    .message-text { color: #e0e4f2; line-height: 1.75; overflow-wrap: anywhere; white-space: pre-wrap; }
    .message.error .message-text { color: #ff9aaa; }

    .composer-area {
      padding: 14px 22px 18px;
      background: linear-gradient(transparent, var(--bg) 20%);
    }

    .composer {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      width: min(800px, 100%);
      margin: 0 auto;
      padding: 10px;
      border: 1px solid #343b53;
      border-radius: 17px;
      background: #131725;
      box-shadow: 0 10px 40px #0002;
    }

    .composer:focus-within { border-color: #8b7cffaa; }

    #messageInput {
      flex: 1;
      min-width: 0;
      max-height: 180px;
      padding: 9px 8px;
      resize: none;
      outline: none;
      border: 0;
      background: transparent;
      color: white;
      line-height: 1.5;
    }

    #messageInput::placeholder { color: #7f879e; }

    .send-button {
      flex-shrink: 0;
      width: 42px;
      height: 42px;
      border: 0;
      border-radius: 12px;
      background: var(--accent);
      color: white;
      font-size: 19px;
      font-weight: 800;
    }

    .send-button:hover { background: var(--accent2); }
    .send-button:disabled { opacity: .5; cursor: not-allowed; }

    .disclaimer {
      width: min(800px, 100%);
      margin: 10px auto 0;
      color: #747d94;
      text-align: center;
      font-size: 10px;
    }

    .overlay { display: none; }

    @media (max-width: 760px) {
      .app { grid-template-columns: minmax(0, 1fr); }

      .sidebar {
        position: fixed;
        z-index: 20;
        top: 0;
        bottom: 0;
        left: 0;
        width: min(290px, 85vw);
        transform: translateX(-105%);
        transition: transform .22s ease;
        box-shadow: 15px 0 45px #0005;
      }

      .sidebar.open { transform: translateX(0); }

      .overlay {
        position: fixed;
        z-index: 15;
        inset: 0;
        background: #0009;
      }

      .overlay.visible { display: block; }
      .menu-button { display: inline-block; }
      .topbar { padding: 13px 15px; }
      .chat-inner { padding: 25px 16px 35px; }
      .composer-area { padding: 10px 12px 13px; }
      .welcome { padding: 35px 5px; }
      .suggestions { gap: 7px; }
      .suggestion { font-size: 11px; }
    }
  </style>
</head>

<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="logo">N</div>
        <div>
          <h1>NEXUS AI</h1>
          <small>Tu espacio inteligente</small>
        </div>
      </div>

      <button class="new-chat" id="newChatButton">＋ Nuevo chat</button>

      <div class="history-heading">
        <span>Historial</span>
        <button class="small-button" id="clearAllButton">Borrar todo</button>
      </div>

      <div class="history" id="history"></div>

      <div class="sidebar-footer">
        NEXUS AI · Versión 0.2<br>
        Tus chats se guardan en este navegador.
      </div>
    </aside>

    <div class="overlay" id="overlay"></div>

    <main class="main">
      <header class="topbar">
        <div style="display:flex;align-items:center;gap:12px">
          <button class="menu-button" id="menuButton" aria-label="Abrir menú">☰</button>
          <div class="topbar-title" id="currentTitle">Nuevo chat</div>
        </div>
        <div class="status">● Sistema disponible</div>
      </header>

      <section class="chat" id="chat" aria-live="polite">
        <div class="chat-inner" id="chatInner"></div>
      </section>

      <div class="composer-area">
        <form class="composer" id="chatForm">
          <textarea
            id="messageInput"
            placeholder="Escribe tu mensaje a NEXUS..."
            rows="1"
            maxlength="4000"
            aria-label="Tu mensaje"
            required
          ></textarea>
          <button class="send-button" id="sendButton" type="submit" aria-label="Enviar mensaje">↑</button>
        </form>
        <div class="disclaimer">NEXUS puede cometer errores. Verifica la información importante.</div>
      </div>
    </main>
  </div>

  <script>
    const STORAGE_KEY = "nexus_ai_chats_v2";

    const historyElement = document.getElementById("history");
    const chatInner = document.getElementById("chatInner");
    const chatElement = document.getElementById("chat");
    const currentTitle = document.getElementById("currentTitle");
    const form = document.getElementById("chatForm");
    const input = document.getElementById("messageInput");
    const sendButton = document.getElementById("sendButton");
    const sidebar = document.getElementById("sidebar");
    const overlay = document.getElementById("overlay");

    let chats = loadChats();
    let activeChatId = null;
    let sending = false;

    function loadChats() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (!saved) return [];

        const parsed = JSON.parse(saved);
        if (!Array.isArray(parsed)) return [];

        return parsed.filter(chat =>
          chat &&
          typeof chat.id === "string" &&
          typeof chat.title === "string" &&
          Array.isArray(chat.messages)
        );
      } catch (error) {
        console.error("No se pudo cargar el historial:", error);
        return [];
      }
    }

    function saveChats() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(chats));
        return true;
      } catch (error) {
        console.error("No se pudo guardar el historial:", error);
        alert("No se pudo guardar el historial. Revisa el espacio disponible del navegador.");
        return false;
      }
    }

    function makeId() {
      if (typeof crypto !== "undefined" && crypto.randomUUID) {
        return crypto.randomUUID();
      }
      return Date.now().toString(36) + Math.random().toString(36).slice(2);
    }

    function createChat() {
      const chat = {
        id: makeId(),
        title: "Nuevo chat",
        messages: [],
        updatedAt: Date.now()
      };

      chats.unshift(chat);
      activeChatId = chat.id;
      saveChats();
      renderAll();
      closeMenu();
      input.focus();
    }

    function getActiveChat() {
      return chats.find(chat => chat.id === activeChatId) || null;
    }

    function openChat(id) {
      if (sending) return;
      if (!chats.some(chat => chat.id === id)) return;

      activeChatId = id;
      renderAll();
      closeMenu();
    }

    function deleteChat(id) {
      if (sending && activeChatId === id) {
        alert("Espera a que termine la respuesta antes de eliminar este chat.");
        return;
      }

      const chat = chats.find(item => item.id === id);
      if (!chat) return;

      const ok = confirm(`¿Eliminar "${chat.title}"? Esta acción no se puede deshacer.`);
      if (!ok) return;

      chats = chats.filter(item => item.id !== id);

      if (activeChatId === id) {
        activeChatId = chats.length ? chats[0].id : null;
      }

      saveChats();
      renderAll();
    }

    function clearAllChats() {
      if (sending) {
        alert("Espera a que termine la respuesta antes de borrar el historial.");
        return;
      }

      if (!chats.length) {
        alert("El historial ya está vacío.");
        return;
      }

      if (!confirm("¿Seguro que quieres eliminar todos tus chats? No se pueden recuperar.")) {
        return;
      }

      chats = [];
      activeChatId = null;
      saveChats();
      renderAll();
    }

    function renderHistory() {
      historyElement.replaceChildren();

      if (!chats.length) {
        const empty = document.createElement("div");
        empty.className = "empty-history";
        empty.textContent = "Tus conversaciones aparecerán aquí.";
        historyElement.appendChild(empty);
        return;
      }

      chats.forEach(chat => {
        const item = document.createElement("div");
        item.className = "history-item" + (chat.id === activeChatId ? " active" : "");

        const open = document.createElement("button");
        open.className = "history-open";
        open.type = "button";
        open.textContent = chat.title;
        open.title = chat.title;
        open.addEventListener("click", () => openChat(chat.id));

        const remove = document.createElement("button");
        remove.className = "delete-chat";
        remove.type = "button";
        remove.textContent = "×";
        remove.title = "Eliminar conversación";
        remove.setAttribute("aria-label", "Eliminar " + chat.title);
        remove.addEventListener("click", () => deleteChat(chat.id));

        item.append(open, remove);
        historyElement.appendChild(item);
      });
    }

    function addMessage(role, content, isError = false) {
      const wrapper = document.createElement("article");
      wrapper.className = "message " + role + (isError ? " error" : "");

      const avatar = document.createElement("div");
      avatar.className = "avatar";
      avatar.textContent = role === "user" ? "TÚ" : "N";

      const body = document.createElement("div");
      body.className = "message-body";

      const name = document.createElement("div");
      name.className = "message-name";
      name.textContent = role === "user" ? "Tú" : "NEXUS";

      const text = document.createElement("div");
      text.className = "message-text";
      text.textContent = content;

      body.append(name, text);
      wrapper.append(avatar, body);
      chatInner.appendChild(wrapper);
    }

    function renderWelcome() {
      const welcome = document.createElement("div");
      welcome.className = "welcome";

      const logo = document.createElement("div");
      logo.className = "welcome-logo";
      logo.textContent = "N";

      const title = document.createElement("h2");
      title.textContent = "¿Qué vamos a crear hoy?";

      const description = document.createElement("p");
      description.textContent = "Soy NEXUS, tu asistente de inteligencia artificial. Pregunta, aprende, programa o desarrolla tus ideas.";

      const suggestions = document.createElement("div");
      suggestions.className = "suggestions";

      [
        "Explícame algo difícil",
        "Ayúdame a programar",
        "Dame ideas creativas"
      ].forEach(label => {
        const button = document.createElement("button");
        button.className = "suggestion";
        button.type = "button";
        button.textContent = label;
        button.addEventListener("click", () => {
          input.value = label;
          input.focus();
          resizeInput();
        });
        suggestions.appendChild(button);
      });

      welcome.append(logo, title, description, suggestions);
      chatInner.appendChild(welcome);
    }

    function renderMessages() {
      chatInner.replaceChildren();

      const chat = getActiveChat();

      if (!chat || chat.messages.length === 0) {
        renderWelcome();
        return;
      }

      chat.messages.forEach(message => {
        addMessage(message.role, message.content, message.isError === true);
      });

      chatElement.scrollTop = chatElement.scrollHeight;
    }

    function renderAll() {
      renderHistory();

      const chat = getActiveChat();
      currentTitle.textContent = chat ? chat.title : "Nuevo chat";

      renderMessages();
    }

    function closeMenu() {
      sidebar.classList.remove("open");
      overlay.classList.remove("visible");
    }

    function openMenu() {
      sidebar.classList.add("open");
      overlay.classList.add("visible");
    }

    function resizeInput() {
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, 180) + "px";
    }

    input.addEventListener("input", resizeInput);

    input.addEventListener("keydown", event => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        form.requestSubmit();
      }
    });

    document.getElementById("newChatButton").addEventListener("click", createChat);
    document.getElementById("clearAllButton").addEventListener("click", clearAllChats);
    document.getElementById("menuButton").addEventListener("click", openMenu);
    overlay.addEventListener("click", closeMenu);

    form.addEventListener("submit", async event => {
      event.preventDefault();

      const message = input.value.trim();
      if (!message || sending) return;

      if (message.length > 4000) {
        alert("El mensaje no puede superar los 4000 caracteres.");
        return;
      }

      if (!activeChatId || !getActiveChat()) {
        const chat = {
          id: makeId(),
          title: message.slice(0, 38) + (message.length > 38 ? "..." : ""),
          messages: [],
          updatedAt: Date.now()
        };

        chats.unshift(chat);
        activeChatId = chat.id;
      }

      const chat = getActiveChat();
      if (!chat) return;

      if (chat.messages.length === 0) {
        chat.title = message.slice(0, 38) + (message.length > 38 ? "..." : "");
      }

      chat.messages.push({ role: "user", content: message });
      chat.updatedAt = Date.now();

      input.value = "";
      resizeInput();
      sending = true;
      sendButton.disabled = true;
      sendButton.textContent = "…";

      saveChats();
      renderAll();
      chatElement.scrollTop = chatElement.scrollHeight;

      const loading = document.createElement("article");
      loading.className = "message";
      loading.id = "loadingMessage";

      const loadingAvatar = document.createElement("div");
      loadingAvatar.className = "avatar";
      loadingAvatar.textContent = "N";

      const loadingBody = document.createElement("div");
      loadingBody.className = "message-body";

      const loadingName = document.createElement("div");
      loadingName.className = "message-name";
      loadingName.textContent = "NEXUS";

      const loadingText = document.createElement("div");
      loadingText.className = "message-text";
      loadingText.textContent = "Pensando...";

      loadingBody.append(loadingName, loadingText);
      loading.append(loadingAvatar, loadingBody);
      chatInner.appendChild(loading);

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message })
        });

        const data = await response.json().catch(() => ({}));

        if (!response.ok) {
          throw new Error(data.error || "No pude obtener una respuesta.");
        }

        if (typeof data.reply !== "string" || !data.reply.trim()) {
          throw new Error("NEXUS no devolvió una respuesta válida.");
        }

        chat.messages.push({
          role: "assistant",
          content: data.reply.trim()
        });
      } catch (error) {
        console.error("Error de NEXUS:", error);
        chat.messages.push({
          role: "assistant",
          content: error.message || "Ocurrió un error. Inténtalo de nuevo.",
          isError: true
        });
      } finally {
        chat.updatedAt = Date.now();
        chats.sort((a, b) => b.updatedAt - a.updatedAt);
        sending = false;
        sendButton.disabled = false;
        sendButton.textContent = "↑";

        saveChats();
        renderAll();
        chatElement.scrollTop = chatElement.scrollHeight;
        input.focus();
      }
    });

    if (chats.length) {
      activeChatId = chats[0].id;
    }

    renderAll();
  </script>
</body>
</html>
